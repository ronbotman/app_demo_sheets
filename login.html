<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 32px 28px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #0f172a;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      color: #0f172a;
      background-color: #ffffff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px 20px;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    button[type="submit"]:active {
      transform: scale(0.99);
    }

    #msg {
      margin-top: 16px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 500;
      color: #dc2626;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <button type="submit">Sign in</button>
    </form>
    <p id="msg"></p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const msg = document.getElementById("msg");
    const URL = "https://script.google.com/macros/s/AKfycbw5eW00Pyr0VahIhn12rM8C7yQcUzCTsb8NznxwIC3T-d2BD4QWD8HuczkJ4EZcuLkcwg/exec";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";

      const params = new URLSearchParams({
        action: "login",
        username: form.username.value,
        password: form.password.value
      });

      try {
        const res = await fetch(URL + "?" + params.toString());
        const data = await res.json();

        if (data.ok) {
          localStorage.setItem("token", data.token);
          window.location.href = "view.html";
        } else {
          msg.textContent = data.error || "Wrong credentials";
        }
      } catch (err) {
        msg.textContent = "Error signing in — try again later";
      }
    });
  </script>
</body>
</html>
